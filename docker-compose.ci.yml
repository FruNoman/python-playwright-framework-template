# Runs exactly what CI runs, locally:
#   docker compose -f docker-compose.playwright.yml -f docker-compose.ci.yml up \
#     --build --abort-on-container-exit --exit-code-from tests
# Exit code = the tests' result; reports, traces and logs end up in ./build.
services:
  tests:
    build: .
    depends_on:
      - playwright
    environment:
      - CI=true
      - RUNNER=server
      - PLAYWRIGHT_SERVER_URL=ws://playwright:3000/
      - TESTS_THREADS=${TESTS_THREADS:-4}
      # BASE_URL / TEST_ENV / BROWSER: passed through from the CI environment
      # (logins are test data: resources/data/*.json — no secrets here)
      - BASE_URL
      - TEST_ENV
      - BROWSER
    volumes:
      - ./build:/workspace/build
